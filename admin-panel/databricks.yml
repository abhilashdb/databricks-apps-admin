bundle:
  name: scale-to-zero-admin

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "scale-to-zero-admin"
      description: "Admin panel for scale-to-zero app monitoring and strategy management"
      source_code_path: ./
      user_api_scopes:
        - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  default:
    default: true
    workspace:
      host: https://fevm-serverless-stable-3rlc3e.cloud.databricks.com

    variables:
      sql_warehouse_id: 4eaa1039609f603b
