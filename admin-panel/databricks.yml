bundle:
  name: databricks-apps-admin

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "databricks-apps-admin"
      description: "Admin panel for scale-to-zero app monitoring and strategy management"
      source_code_path: ./
      user_api_scopes:
        - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  default:
    default: true
    # host comes from --profile passed to bundle deploy
