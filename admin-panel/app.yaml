command: ['npm', 'run', 'start']

# Grant users the sql scope so OBO queries can run against the SQL warehouse.
# Without this, analytics queries fail with "Invalid scope, required scopes: sql".
user_api_scopes:
  - sql

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: WAREHOUSE_ID_PLACEHOLDER
  - name: TELEMETRY_CATALOG
    value: TELEMETRY_CATALOG_PLACEHOLDER
  - name: TELEMETRY_SCHEMA
    value: TELEMETRY_SCHEMA_PLACEHOLDER
